<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes - LembreMED</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="inicio.html" class="sidebar-logo">
                    <div class="sidebar-logo-icon"><i data-lucide="heart-pulse"></i></div>
                    <span>LembreMED</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="inicio.html" class="sidebar-item"><i data-lucide="layout-dashboard"></i><span>Início</span></a>
                <a href="medicamentos.html" class="sidebar-item"><i data-lucide="pill"></i><span>Medicamentos</span></a>
                <a href="pacientes.html" class="sidebar-item active"><i data-lucide="users"></i><span>Pacientes</span></a>
                <a href="historico.html" class="sidebar-item"><i data-lucide="history"></i><span>Histórico</span></a>
                <a href="configuracoes.html" class="sidebar-item"><i data-lucide="settings"></i><span>Configurações</span></a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="logout()" class="sidebar-item" style="color: var(--text-danger);"><i data-lucide="log-out"></i><span>Sair</span></button>
            </div>
        </aside>

        <!-- Content -->
        <div class="main-content">
            <header class="top-bar">
                <button class="mobile-toggle" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
                <div class="user-info">
                    <span id="userNameDisplay" style="font-weight: 700;">Carregando...</span>
                    <div class="user-avatar">CP</div>
                </div>
            </header>

            <main class="content-body animate-up">
                <header style="margin-bottom: 3rem; display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <h1>Meus Pacientes</h1>
                        <p class="subtitle">Gerencie as pessoas que estão sob seus cuidados.</p>
                    </div>
                    <button class="btn btn-primary" onclick="document.querySelector('#patientCaregiverModal h2').innerText = 'Cadastrar Paciente'; document.getElementById('patientFormCaregiver').reset(); openModal('patientCaregiverModal')">
                        <i data-lucide="plus-circle"></i> Novo Paciente
                    </button>
                </header>

                <div class="card">
                    <div class="card-title"><h3>Listagem de Pacientes</h3></div>
                    <div id="patientListContainer" class="med-list">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal: Cadastro de Paciente -->
    <div id="patientCaregiverModal" class="modal-overlay">
        <div class="modal" style="max-width: 600px;">
            <button class="close-modal" onclick="closeModal('patientCaregiverModal')">&times;</button>
            <div class="modal-header"><h2>Cadastrar Paciente</h2></div>
            <form id="patientFormCaregiver" style="margin-top: 2rem;">
                <div class="form-group">
                    <label for="pName">Nome Completo</label>
                    <input type="text" id="pName" class="form-control" required>
                </div>
                <div class="grid-opcoes" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="pAge">Idade</label>
                        <input type="number" id="pAge" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="pContact">Telefone/Contato</label>
                        <input type="text" id="pContact" class="form-control" placeholder="(00) 00000-0000" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="pCondition">Condição Médica Principal</label>
                    <input type="text" id="pCondition" class="form-control" placeholder="Ex: Hipertensão, Diabetes" required>
                </div>
                <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">Salvar Paciente</button>
            </form>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay">
        <div class="modal" style="text-align: center;">
            <h3 id="confirmTitle">Tem certeza?</h3>
            <p id="confirmMessage" style="margin-bottom: 2rem;"></p>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-outline" onclick="closeModal('confirmModal')" style="flex: 1;">Cancelar</button>
                <button id="btnConfirmAction" class="btn btn-primary" style="flex: 1; background: #ef4444;">Excluir</button>
            </div>
        </div>
    </div>

    <div id="notificationContainer" class="notification-container"></div>
    <script src="../js/db.js"></script>
    <script src="../js/DataService.js"></script>
    <script src="../js/controller.js"></script>
    <script>
        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
    </body>
    </html>
