<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - LembreMED</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Fixed Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="inicio.html" class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <i data-lucide="heart-pulse"></i>
                    </div>
                    <span>LembreMED</span>
                </a>
            </div>
            
            <nav class="sidebar-nav">
                <a href="inicio.html" class="sidebar-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Início</span>
                </a>
                <a href="medicamentos.html" class="sidebar-item">
                    <i data-lucide="pill"></i>
                    <span>Medicamentos</span>
                </a>
                <a href="pacientes.html" class="sidebar-item">
                    <i data-lucide="users"></i>
                    <span>Pacientes</span>
                </a>
                <a href="historico.html" class="sidebar-item">
                    <i data-lucide="history"></i>
                    <span>Histórico</span>
                </a>
                <a href="configuracoes.html" class="sidebar-item active">
                    <i data-lucide="settings"></i>
                    <span>Configurações</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="logout()" class="sidebar-item" style="color: var(--text-danger);">
                    <i data-lucide="log-out"></i>
                    <span>Sair</span>
                </button>
            </div>
            </aside>

            <!-- Main Content Area -->
            <div class="main-content">
            <header class="top-bar">
                <button class="mobile-toggle" onclick="toggleSidebar()">
                    <i data-lucide="menu"></i>
                </button>
                <div class="user-info" style="display: flex; align-items: center; gap: 1rem;">
                    <div style="text-align: right;">
                        <span id="userNameDisplay" style="display: block; font-weight: 700; color: var(--text-main);">Carregando...</span>
                        <span style="font-size: 0.8rem; color: var(--text-sub); font-weight: 600;">Cuidador Principal</span>
                    </div>
                    <div class="user-avatar" style="width: 42px; height: 42px; background: var(--primary-light); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: 800; font-size: 1rem; border: 2px solid white; box-shadow: var(--shadow-sm);">
                        CP
                    </div>
                </div>
            </header>

            <main class="content-body animate-up">
                <header style="margin-bottom: 3rem;">
                    <h1 style="font-size: 2.5rem; font-weight: 800; letter-spacing: -0.025em;">Configurações</h1>
                    <p style="font-size: 1.1rem; color: var(--text-sub);">Gerencie suas preferências e os dados do sistema.</p>
                </header>

                <div class="dashboard-grid">
                    <!-- Profile Card -->
                    <div class="card">
                        <div class="card-title">
                            <h3>Perfil e Conta</h3>
                        </div>
                        <div class="form-group">
                            <label>Nome do Usuário</label>
                            <input type="text" id="configName" class="form-control" placeholder="Seu nome">
                        </div>
                        <div class="form-group">
                            <label>E-mail de Contato</label>
                            <input type="email" id="configUserEmail" class="form-control" placeholder="seu@email.com">
                        </div>
                        <button class="btn btn-primary" onclick="app.salvarPerfil()">Salvar Alterações</button>
                    </div>

                    <!-- App Settings -->
                    <div class="card">
                        <div class="card-title">
                            <h3>Preferências de Acessibilidade</h3>
                        </div>
                        <div class="form-group">
                            <label>Tamanho da Fonte</label>
                            <select id="fontSizeSelect" class="form-control" onchange="app.salvarConfiguracoes()">
                                <option value="normal">Padrão</option>
                                <option value="large">Grande</option>
                                <option value="xl">Extra Grande</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 1rem; cursor: pointer;">
                                <input type="checkbox" id="highContrastCheck" style="width: 20px; height: 20px;" onchange="app.salvarConfiguracoes()">
                                <span>Modo de Alto Contraste</span>
                            </label>
                        </div>
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 1rem; cursor: pointer;">
                                <input type="checkbox" id="soundNotif" style="width: 20px; height: 20px;" onchange="app.salvarConfiguracoes()">
                                <span>Alertas Sonoros</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Danger Zone -->
                <div class="card" style="border-color: #fee2e2; margin-top: 2rem;">
                    <div class="card-title">
                        <h3 style="color: #ef4444;">Zona de Perigo</h3>
                    </div>
                    <p style="margin-bottom: 1.5rem; color: var(--text-sub);">Cuidado: estas ações apagam os dados locais permanentemente.</p>
                    <button class="btn btn-outline" style="border-color: #fee2e2; color: #ef4444;" onclick="app.limparDados()">Limpar Todo o Banco de Dados</button>
                </div>
            </main>
            </div>
            </div>

            <div id="notificationContainer" class="notification-container"></div>
            <script src="../js/db.js"></script>
            <script src="../js/DataService.js"></script>
            <script src="../js/controller.js"></script>
            <script>
            document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            });
            </script>
            </body>
            </html>
